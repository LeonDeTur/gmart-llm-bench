# Режим и параметры расчёта обеспеченности (ProvisionPlanBuilder).
stage: provision.plan
defaults:
  services_catalog: ["Школа", "Детский сад", "Поликлиника", "Аптека", "Спортивный зал"]

cases:
  - id: current_provision_single
    tags: [smoke]
    input: {user_query: "Какая обеспеченность школами?"}
    expect:
      - {path: mode, eq: provision}
      - {path: service_name, eq: "Школа"}

  - id: effects_single_service_declension
    input: {user_query: "Как проект повлияет на обеспеченность детскими садами?"}
    expect:
      - {path: mode, eq: effects}
      - {path: service_name, eq: "Детский сад"}

  # Промпт противоречив: provision — «без упоминания эффектов», а при неясности велит
  # выбирать effects. Режим здесь не оценивается, только сервис.
  - id: ambiguous_single_service_defaults_to_effects
    input: {user_query: "Расскажи про обеспеченность поликлиниками в проекте"}
    expect:
      - {path: mode, in: [effects, provision]}
      - {path: service_name, eq: "Поликлиника"}

  - id: summary_all_services
    tags: [smoke]
    input: {user_query: "Дай сводку по обеспеченности сервисами"}
    expect:
      - {path: mode, eq: summary}
      - {path: service_names, len: 0}

  - id: summary_worst_services
    input: {user_query: "Какими сервисами территория обеспечена хуже всего?"}
    expect:
      - {path: mode, eq: summary}

  - id: effects_summary_all
    input: {user_query: "Сравни обеспеченность по всем сервисам до и после реализации проекта"}
    expect:
      - {path: mode, eq: effects_summary}
      - {path: service_names, len: 0}

  - id: effects_without_service_is_summary
    input: {user_query: "Как проект повлияет на обеспеченность?"}
    expect:
      - {path: mode, eq: effects_summary}

  - id: list_services
    input: {user_query: "Какие сервисы есть в проекте?"}
    expect:
      - {path: mode, eq: list_services}

  - id: summary_subset_with_layers
    input: {user_query: "Сводка по школам и аптекам, слои аптек покажи на карте"}
    expect:
      - {path: mode, eq: summary}
      - {path: service_names, set_eq: ["Школа", "Аптека"]}
      - {path: layer_service_names, eq: ["Аптека"]}

  - id: unknown_service_needs_clarification
    tags: [clarification]
    input: {user_query: "Какая обеспеченность бассейнами?"}
    expect:
      - {path: mode, eq: needs_clarification}
      - {path: clarification_question, "null": false}

  - id: target_population_explicit
    input: {user_query: "Рассчитай эффекты по школам для населения 45 000 человек"}
    expect:
      - {path: mode, eq: effects}
      - {path: service_name, eq: "Школа"}
      - {path: target_population, eq: 45000}

  - id: project_word_is_not_a_service
    input: {user_query: "Какая обеспеченность аптеками в проекте и сценарии?"}
    expect:
      - {path: service_name, eq: "Аптека"}
      - {path: target_population, "null": true}

  - id: followup_population_from_history
    tags: [history]
    input:
      history:
        - {role: user, content: "Какая обеспеченность школами?"}
        - {role: assistant, content: "Обеспеченность школами — 78%."}
      user_query: "Пересчитай с населением 30000"
    expect:
      - {path: mode, eq: provision}
      - {path: service_name, eq: "Школа"}
      - {path: target_population, eq: 30000}

  - id: followup_latest_population_wins
    tags: [history]
    input:
      history:
        - {role: user, content: "Как проект повлияет на обеспеченность детскими садами при 20000 жителей?"}
        - {role: assistant, content: "При 20000 жителей дефицит детских садов — 120 мест."}
      user_query: "Нет, возьми 25000"
    expect:
      - {path: mode, eq: effects}
      - {path: service_name, eq: "Детский сад"}
      - {path: target_population, eq: 25000}

  - id: effects_after_project_clinics
    input: {user_query: "Что будет с обеспеченностью поликлиниками после реализации проекта?"}
    expect:
      - {path: mode, eq: effects}
      - {path: service_name, eq: "Поликлиника"}

  - id: effects_calc_sports_hall
    tags: [holdout]
    input: {user_query: "Рассчитай эффекты обеспеченности спортивными залами"}
    expect:
      - {path: mode, eq: effects}
      - {path: service_name, eq: "Спортивный зал"}

  - id: provision_pharmacy_current
    input: {user_query: "Покажи текущую обеспеченность аптеками"}
    expect:
      - {path: mode, eq: provision}
      - {path: service_name, eq: "Аптека"}

  - id: effects_summary_two_services
    input: {user_query: "Как проект повлияет на обеспеченность школами и детскими садами?"}
    expect:
      - {path: mode, eq: effects_summary}
      - {path: service_names, set_eq: ["Школа", "Детский сад"]}
      - {path: service_name, "null": true}

  - id: summary_best_served
    tags: [holdout]
    input: {user_query: "Какими сервисами население обеспечено лучше всего?"}
    expect:
      - {path: mode, eq: summary}
      - {path: service_names, len: 0}

  - id: list_for_analysis
    input: {user_query: "Что доступно для анализа обеспеченности?"}
    expect:
      - {path: mode, eq: list_services}

  - id: summary_with_population
    input: {user_query: "Дай сводку обеспеченности для 12 000 жителей"}
    expect:
      - {path: mode, eq: summary}
      - {path: target_population, eq: 12000}

  - id: effects_summary_with_layers
    tags: [holdout]
    input: {user_query: "Сравни обеспеченность всеми сервисами до и после проекта и покажи на карте слои спортивных залов"}
    expect:
      - {path: mode, eq: effects_summary}
      - {path: service_names, len: 0}
      - {path: layer_service_names, eq: ["Спортивный зал"]}

  - id: unknown_service_effects
    tags: [clarification]
    input: {user_query: "Как проект повлияет на обеспеченность библиотеками?"}
    expect:
      - {path: mode, eq: needs_clarification}
      - {path: service_name, "null": true}
      - {path: clarification_question, "null": false}

  - id: followup_switch_service
    tags: [history]
    input:
      history:
        - {role: user, content: "Как проект повлияет на обеспеченность школами?"}
        - {role: assistant, content: "После реализации проекта обеспеченность школами вырастет с 72% до 85%."}
      user_query: "А для аптек?"
    expect:
      - {path: mode, eq: effects}
      - {path: service_name, eq: "Аптека"}

  - id: followup_switch_to_effects
    tags: [history]
    input:
      history:
        - {role: user, content: "Какая обеспеченность детскими садами?"}
        - {role: assistant, content: "Обеспеченность детскими садами — 64%, дефицит 210 мест."}
      user_query: "А как на это повлияет проект?"
    expect:
      - {path: mode, eq: effects}
      - {path: service_name, eq: "Детский сад"}

  - id: population_with_thousands_space
    tags: [holdout]
    input: {user_query: "Какая обеспеченность детскими садами при численности населения 8 500 человек?"}
    expect:
      - {path: mode, eq: provision}
      - {path: service_name, eq: "Детский сад"}
      - {path: target_population, eq: 8500}

  - id: summary_subset_no_layers
    input: {user_query: "Сводка обеспеченности по поликлиникам и аптекам"}
    expect:
      - {path: mode, eq: summary}
      - {path: service_names, set_eq: ["Поликлиника", "Аптека"]}
      - {path: layer_service_names, len: 0}

  - id: off_topic_needs_clarification
    tags: [clarification]
    input: {user_query: "Построй мне маршрут до ближайшей школы"}
    expect:
      - {path: mode, eq: needs_clarification}

  - id: followup_summary_population
    tags: [history, holdout]
    input:
      history:
        - {role: user, content: "Дай сводку по обеспеченности сервисами"}
        - {role: assistant, content: "Хуже всего территория обеспечена поликлиниками (41%) и спортивными залами (48%)."}
      user_query: "Пересчитай для 50000 жителей"
    expect:
      - {path: mode, eq: summary}
      - {path: target_population, eq: 50000}

  - id: effects_summary_improves_most
    input: {user_query: "Какие сервисы проект улучшит сильнее всего?"}
    expect:
      - {path: mode, eq: effects_summary}
      - {path: service_names, len: 0}

  - id: scenario_word_not_a_service
    input: {user_query: "Какая обеспеченность спортивными залами в сценарии?"}
    expect:
      - {path: mode, eq: provision}
      - {path: service_name, eq: "Спортивный зал"}

  - id: typos_in_service
    tags: [holdout]
    input: {user_query: "Какая обеспеченость поликлинниками?"}
    expect:
      - {path: mode, eq: provision}
      - {path: service_name, eq: "Поликлиника"}

  - id: followup_keeps_population
    tags: [history, holdout]
    input:
      history:
        - {role: user, content: "Как проект повлияет на обеспеченность школами при 20000 жителей?"}
        - {role: assistant, content: "При 20000 жителей обеспеченность школами после проекта — 91%."}
      user_query: "А для детских садов?"
    expect:
      - {path: mode, eq: effects}
      - {path: service_name, eq: "Детский сад"}
      - {path: target_population, eq: 20000}

  - id: single_service_layers_not_summary
    input: {user_query: "Покажи на карте, как проект повлияет на обеспеченность аптеками"}
    expect:
      - {path: mode, eq: effects}
      - {path: service_name, eq: "Аптека"}
      - {path: layer_service_names, len: 0}
